<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Mã Loại Sản Phẩm</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.2/css/bootstrap.min.css}"/>
    <script th:src="@{/webjars/jquery/3.6.3/jquery.min.js}"></script>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h5 {
            text-align: center;
            color: #333;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h5>Thêm Mã Loại Sản Phẩm</h5>
    <form action="/admin/adproductype-save" method="post">
        <div class="mb-3">
            <label for="productCode" class="form-label">Mã Sản Phẩm</label>
            <input type="text" name="productCode" id="productCode" class="form-control form-control-sm">
        </div>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Mô Tả</label>
            <input type="text" name="productDescription" id="productDescription" class="form-control form-control-sm">
        </div>
        <button type="submit" class="btn btn-primary">Thêm mới</button>
    </form>
</div>
</body>
</html>
