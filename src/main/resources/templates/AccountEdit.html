<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script th:src="@{/webjars/jquery/3.6.3/jquery.min.js}"></script>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.2/css/bootstrap.min.css} "/>
    <script th:src="@{/webjars/bootstrap/5.2.2/js/bootstrap.js}"></script>

    <link th:rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.css} "/>
</head>
<body>
<div class="container">
    <div th:include="Menu.html"></div>

    <h1>Account update</h1>
    <form action="/admin/account-update" method="post">

        <input type="hidden" name="id" th:value="${account.id}" class="form-control">
        <div class="">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" th:value="${account.username}" class="form-control">
        </div>
        <div class="">
            <label for="fullName">fullName</label>
            <input type="text" name="fullName" id="fullName" th:value="${account.fullName}" class="form-control">
        </div>
        <div class="">
            <label for="email">email</label>
            <input type="text" name="email" id="email" th:value="${account.email}" class="form-control">
        </div>
        <div class="">
            <button class="btn btn-success btn-sm">Update</button>
        </div>
    </form>
</div>
</body>
</html>
