<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account List</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.2/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.css}"/>
    <script th:src="@{/webjars/jquery/3.6.3/jquery.min.js}"></script>

    <link rel="stylesheet" th:href="@{/assets/fontawesome-free-6.2.1-web/css/all.css}"/>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
        }
        h5 {
            text-align: center;
            color: #333;
        }
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #c03ed9;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .center-content {
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex !important;
            justify-content: center !important; /* Căn giữa nội dung theo chiều ngang */
            align-items: center !important;
            height: 70vh !important; /* Chiều cao toàn màn hình */
            flex-direction: column !important; /* Đặt các phần tử theo chiều dọc */
        }
    </style>
</head>
<body>
<div th:include="Menu.html"></div>
<!--    <div th:insert="Menu.html::Menu"></div>-->
<div class="center-content">
    <h5>Account List</h5>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Fullname</th>
            <th>Email</th>
            <th>Role</th>
            <th>Is Active</th>
            <th>Sửa</th>
            <th>Xoá</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.id}"></td>
            <td th:text="${account.username}"></td>
            <td th:text="${account.fullName}"></td>
            <td th:text="${account.email}"></td>
            <td>
                <span th:if="${account.isActive == true}" class="badge bg-primary">Active</span>
                <a th:href="${'/admin/isActive/' + account.id + '/0'}" th:if="${account.isActive == true}">
                    <span class="far fa-user"></span>
                </a>

                <span th:if="${account.isActive == false}" class="badge bg-secondary">Inactive</span>
                <a th:href="${'/admin/isActive/' + account.id + '/1'}" th:if="${account.isActive == false}">
                    <span th:if="${account.isActive == false}" class="fas fa-user-cog text-success"></span>
                </a>
            </td>
            <td>
                <span th:if="${account.role == 'ADMIN'}" class="fas fa-user-cog text-success" title="Administrator"></span>
                <span th:if="${account.role == 'EMP'}" class="far fa-user" title="Employee"></span>
            </td>
            <td>
                <a th:href="@{/admin/account-edit/{id}(id=${account.id})}" class="btn btn-danger btn-sm">Sửa</a>
            </td>
            <td>
                <a th:href="@{/admin/account-delete/{id}(id=${account.id})}" class="btn btn-danger btn-sm">Delete</a>
            </td>

        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
