<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Mật khẩu Mới</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<style>
    /* Căn giữa container */
    .container {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25),
        0 10px 10px rgba(0, 0, 0, 0.22);
        position: relative;
        overflow: hidden;
        max-width: 400px;
        min-height: 350px;
        margin: 50px auto; /* Căn giữa container trên màn hình */
        padding: 20px;
    }

    /* Căn giữa các phần tử trong form */
    .form-group {
        margin-bottom: 15px;
    }

    h4 {
        text-align: center; /* Căn giữa tiêu đề */
        margin-bottom: 30px;
    }

    /* Căn giữa nút gửi */
    .btn {
        width: 100%; /* Nút gửi chiếm toàn bộ chiều rộng */
    }

</style>
<body>
<div class="container" style="max-width: 600px; margin-top: 50px;">
    <h4>Nhập Mật khẩu Mới</h4>
    <form action="/enter-password" method="post" onsubmit="return validatePassword()">
        <!-- Truyền email qua URL vào form -->
        <input type="hidden" name="email" th:value="${email}" />

        <div class="form-group">
            <label for="password">Mật khẩu mới:</label>
            <input type="password" class="form-control" name="password" id="password" required placeholder="Nhập mật khẩu mới" />
        </div>

        <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu:</label>
            <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" required placeholder="Xác nhận mật khẩu mới" />
        </div>

        <button type="submit" class="btn btn-primary">Gửi</button>
    </form>
</div>

<script>
    // Hàm kiểm tra mật khẩu và mật khẩu xác nhận có trùng khớp không
    function validatePassword() {
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Mật khẩu và xác nhận mật khẩu không khớp.");
            return false; // Dừng việc submit form
        }
        return true; // Tiến hành submit form nếu mật khẩu khớp
    }
</script>
</body>
</html>
